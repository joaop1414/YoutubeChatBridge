name: Compilar e publicar mod

on:
  workflow_dispatch:
    inputs:
      confirmar_publicacao:
        description: "Confirmar que deseja criar uma GitHub Release pública"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Compilar e publicar
    if: github.ref == 'refs/heads/main' && inputs.confirmar_publicacao == true
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Calcular próxima versão
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @()

          foreach ($tag in (git tag --list)) {
            if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              $versions += [pscustomobject]@{
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
          }

          if ($versions.Count -eq 0) {
            $major = 1
            $minor = 0
            $patch = 0
          }
          else {
            $latest = $versions | Sort-Object Major, Minor, Patch | Select-Object -Last 1
            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch + 1

            if ($patch -gt 9) {
              $patch = 0
              $minor++
            }

            if ($minor -gt 9) {
              $minor = 0
              $major++
            }
          }

          $version = "$major.$minor.$patch"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Versão calculada: v$version"

      - name: Restaurar dependências
        run: dotnet restore .\YouTubeVoteBridge.csproj

      - name: Compilar mod
        run: dotnet build .\YouTubeVoteBridge.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }} -p:VersionPrefix=${{ steps.version.outputs.VERSION }} -p:VersionSuffix=

      - name: Validar e preparar DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net6.0/YouTubeVoteBridge.dll'

          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            Write-Host 'Arquivos encontrados em bin/Release:'
            Get-ChildItem -Path 'bin/Release' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "A compilação terminou, mas a DLL esperada não foi encontrada: $dll"
          }

          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item -LiteralPath $dll -Destination "release/YouTubeVoteBridge-v${{ steps.version.outputs.VERSION }}.dll" -Force

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v${{ steps.version.outputs.VERSION }}"

          gh release create $tag "release/YouTubeVoteBridge-v${{ steps.version.outputs.VERSION }}.dll" --title "YouTubeChatBridge $tag" --notes "Versão $tag do YouTubeChatBridge."
